site_name: Agent Engine
site_description: Agent Engine Documentation
site_url: https://agent-engine.internal/docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: API.md
  - Architecture: ARCHITECTURE.md
  - Deployment: DEPLOYMENT.md
  - Development: DEVELOPMENT.md
  - Security: SECURITY.md
  - API Reference: API.md

docs_dir: docs
site_dir: site
