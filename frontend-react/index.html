<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon is referenced, not inlined: public/favicon.svg is the one
         drawing, and a data-URI copy here is a second one that drifts. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <!-- One theme-color: the app is dark in both themes, so the browser UI always
         matches the page. Kept in step with --color-bg-page in src/index.css. -->
    <meta name="theme-color" content="#20222E" />
    <meta name="description" content="Local-first AI Agent Workbench" />
    <title>Climber - AI Agent Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker registration for PWA offline support. When the worker has
      // to answer a request from cache because the network failed, it posts a
      // STALE_RESPONSE message; show a persistent offline hint so a list that
      // echoes the stale cache is not mistaken for fresh data (R12-H63).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (!event.data || event.data.type !== 'STALE_RESPONSE') return;
          if (document.getElementById('offline-stale-banner')) return;
          const banner = document.createElement('div');
          banner.id = 'offline-stale-banner';
          banner.setAttribute('role', 'status');
          banner.textContent = 'Network unreachable — showing cached data';
          Object.assign(banner.style, {
            position: 'fixed',
            left: '50%',
            bottom: '12px',
            transform: 'translateX(-50%)',
            zIndex: '9999',
            padding: '6px 14px',
            borderRadius: '8px',
            background: '#20222E',
            border: '1px solid #3A3F55',
            color: '#F2F4FF',
            fontSize: '12px',
            boxShadow: '0 4px 16px rgba(0,0,0,0.35)',
          });
          document.body.appendChild(banner);
        });
      }
    </script>
  </body>
</html>
