# Agent Engine - Python Project Configuration
# Tools: ruff, mypy, pytest, coverage

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-engine"
version = "1.0.0"
description = "Climber - Local-first AI Agent Platform"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
climber-headless = "app.headless.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

# =============================================================================
# Ruff - Linting & Formatting
# https://docs.astral.sh/ruff/
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
# Lint gate scope (Design A).
# The gate covers first-party source that must stay clean: app/, tests/ and the
# hand-written part of alembic/. Scratch, benchmark, example and vendored trees
# are excluded from discovery so their debt cannot drown the real signal.
# This list is duplicated verbatim in ruff.toml because ruff.toml shadows
# pyproject.toml: a change in only one of the two is a bug.
extend-exclude = [
    # build / vcs / runtime noise
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "htmlcov",
    "logs",
    "workspace",
    # generated migrations (alembic/env.py and friends stay gated)
    "alembic/versions",
    # scratch / benchmark / example / vendored trees (out of gate scope)
    "examples",                        # teaching and demo scripts
    "adapters",                        # vendored arcbench harness
    "benchmark*.py",                   # benchmark harnesses
    "comprehensive_performance_test.py",  # one-off load test
    "optimize_database.py",            # one-off DB maintenance script
    "redis_cache_warming.py",          # one-off cache warmer
    "frontend-react",                  # JS/TS tree, gated by eslint + tsc
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "SLF",    # flake8-self
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "ERA",    # eradicate
    "NPY",    # numpy-specific rules
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit (security)
    "TRY",    # tryceratops
    "FLY",    # flynt
    "PERF",   # perflint
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults (FastAPI pattern)
    "S101",    # use of assert (needed for type narrowing)
    "TRY003",  # specify messages outside exception class
    "A003",    # class attribute shadowing builtin
    "SLF001",  # private member access is used pervasively on DI holders
    "RUF001",  # full-width punctuation in Chinese strings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # allow assert in tests
    "ARG001",  # unused function arguments (fixtures)
    "ARG002",  # unused method arguments (fixtures)
    "ARG005",  # unused lambda arguments (parametrize stubs)
    "SLF001",  # private member access
    "PLR2004", # magic numbers
    "PT009",   # unittest-style assertions are clearer for some parametrised cases
    "PT018",   # composite assertions
    "PT011",   # raises(Exception) is deliberate in negative-path tests
    "PT027",   # unittest-style raises assertions
    "TC001",   # runtime imports are needed for module patching
    "TC002",
    "TC003",
    "S105",    # security tests deliberately pass weak/placeholder secrets
    "S106",
    "S107",
]
"alembic/**/*.py" = [
    "E402",    # module-level import not at top
]
"app/api/v1/auth_management.py" = ["S105"]  # "bearer" is the OAuth2 token type, not a secret
"app/models/users.py" = ["S105"]              # "bearer" is the OAuth2 token type, not a secret
"app/middleware/security.py" = ["S105"]       # header names, not credentials
"app/core/auth_manager.py" = ["S105"]        # local-only fallback secret, replaced in production
"app/integrations/clients/github_client.py" = ["S105"]
"app/workflow/engine.py" = ["S105"]
"app/config.py" = ["S105"]
"app/core/engine/tool_rules.py" = ["S105"]
"app/headless/workspace.py" = ["S602", "S607"]  # executes agent-authored commands by design
"app/tools/builtins.py" = ["S307"]  # calculator eval is guarded by an AST node allowlist
"app/core/sandbox.py" = ["S602", "S603", "S607"]  # the sandbox is the boundary that runs commands

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

# =============================================================================
# Mypy - Static Type Checking
# https://mypy.readthedocs.io/en/stable/config_file.html
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true
color_output = true
error_summary = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "playwright.*",
    "structlog.*",
    "telegram.*",
    "alembic.*",
    "sqlalchemy.*",
    "httpx.*",
]
ignore_missing_imports = true

# =============================================================================
# Pytest Configuration
# https://docs.pytest.org/en/stable/customize.html
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--showlocals",
    "-ra",
    "--color=yes",
    "--timeout=120",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "e2e: marks end-to-end tests",
    "security: marks security-related tests",
    "performance: marks performance tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli = false
log_cli_level = "INFO"
minversion = "7.0"

# =============================================================================
# Coverage.py Configuration
# https://coverage.readthedocs.io/en/latest/config.html
# =============================================================================
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
    "app/__main__.py",
    "app/main.py",
    "app/utils/massive_final/*",
    "app/utils/ultimate/*",
    "app/utils/extreme/*",
    "app/utils/ultra_mega/*",
    "app/utils/mega/*",
    "app/utils/super/*",
    "app/utils/max/*",
    "app/utils/ultra/*",
    "app/utils/huge/*",
    "app/utils/massive/*",
    "app/final/*",
    "app/models/*",
    "app/api/*",
    "app/tools/builtin_extended/*",
    "app/tools/mcp_plugins/*",
    "app/schemas/*",
    "app/services/*",
    "app/skills/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "^\\s*\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"
title = "Climber Agent Engine - Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"
