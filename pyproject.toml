[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true
color_output = true
error_summary = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "playwright.*",
    "structlog.*",
    "telegram.*",
    "alembic.*",
    "sqlalchemy.*",
    "httpx.*"
]
ignore_missing_imports = true

# =============================================================================
# Pytest Configuration
# https://docs.pytest.org/en/stable/customize.html
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--showlocals",
    "-ra",
    "--color=yes",
    "--timeout=120"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "e2e: marks end-to-end tests",
    "security: marks security-related tests",
    "performance: marks performance tests"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli = false
log_cli_level = "INFO"
minversion = "7.0"

# =============================================================================
# Coverage.py Configuration
# https://coverage.readthedocs.io/en/latest/config.html
# =============================================================================
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
    "app/__main__.py",
    "app/main.py",
    "app/utils/massive_final/*",
    "app/utils/ultimate/*",
    "app/utils/extreme/*",
    "app/utils/ultra_mega/*",
    "app/utils/mega/*",
    "app/utils/super/*",
    "app/utils/max/*",
    "app/utils/ultra/*",
    "app/utils/huge/*",
    "app/utils/massive/*",
    "app/final/*",
    "app/models/*",
    "app/api/*",
    "app/tools/builtin_extended/*",
    "app/tools/mcp_plugins/*",
    "app/schemas/*",
    "app/services/*",
    "app/skills/*"
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "^\\s*\\.\\.\\."
]

[tool.coverage.html]
directory = "htmlcov"
title = "Climber Agent Engine - Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"
