name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-asyncio pytest-timeout ruff
      - name: Lint backend
        run: ruff check app/ tests/ --no-cache
      - name: Test backend
        run: python -m pytest tests/ -q --no-header -p no:cacheprovider --timeout=180

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm run test -- --maxWorkers=2 --reporter=dot
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: "ci-p@ss:/?#%"
      REDIS_PASSWORD: "ci-r@dis:/?#%"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API image
        run: docker build --tag climber-api:ci .
