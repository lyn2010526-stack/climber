name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ===========================================================================
  # Stage 1: Lint & Format Check
  # ===========================================================================
  backend-lint:
    name: Backend Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff formatter check
        run: ruff format --check .

      - name: Run mypy type check
        run: mypy app/ --ignore-missing-imports

  # ===========================================================================
  # Stage 2: Frontend Lint & Build
  # ===========================================================================
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run typecheck

      - name: Build frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

      - name: Run frontend tests
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm test

  # ===========================================================================
  # Stage 3: Backend Tests with Coverage
  # ===========================================================================
  backend-test:
    name: Backend Tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-lint]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: climber
          POSTGRES_PASSWORD: climber
          POSTGRES_DB: climber
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://climber:climber@localhost:5432/climber
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
        run: |
          pytest tests/ -v \
            -m "not slow and not e2e" \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --timeout=60 \
            --junitxml=test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ===========================================================================
  # Stage 4: Security Scan
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit
          pip install -r requirements.txt

      - name: Run bandit security scan
        run: bandit -r app/ -f json -o bandit-report.json --severity-level medium || true

      - name: Check for known vulnerabilities
        run: safety check -r requirements.txt --full-report || true

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --format json --output pip-audit-report.json || true

      - name: Check for hardcoded secrets
        run: |
          pip install detect-secrets
          if [ -f .secrets-baseline.json ]; then
            detect-secrets audit .secrets-baseline.json || true
          else
            detect-secrets scan --all-files > .secrets-baseline.json || true
            detect-secrets audit .secrets-baseline.json || true
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  # ===========================================================================
  # Stage 5: E2E Tests
  # ===========================================================================
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: climber
          POSTGRES_PASSWORD: climber
          POSTGRES_DB: climber
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: frontend-react
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend-react
        env:
          DATABASE_URL: postgresql+asyncpg://climber:climber@localhost:5432/climber
          APP_ENV: testing
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8000
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run test:e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: frontend-react/playwright-report/
          retention-days: 14

  # ===========================================================================
  # Stage 6: Build Verification
  # ===========================================================================
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agent-engine:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: agent-engine-frontend:ci-test

      - name: Verify backend image
        run: |
          docker run --rm agent-engine:ci-test python -c "import app; print('Backend image OK')"

      - name: Verify frontend image
        run: |
          docker run --rm agent-engine-frontend:ci-test node -e "console.log('Frontend image OK')"

  # ===========================================================================
  # Stage 7: Quality Gate
  # ===========================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-test, security-scan, build-verification]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Backend Test: ${{ needs.backend-test.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Build Verification: ${{ needs.build-verification.result }}"
          if [[ "${{ needs.backend-test.result }}" != "success" ]] || \
             [[ "${{ needs.security-scan.result }}" != "success" ]] || \
             [[ "${{ needs.build-verification.result }}" != "success" ]]; then
            echo "Quality gate FAILED"
            exit 1
          fi
          echo "Quality gate PASSED"
