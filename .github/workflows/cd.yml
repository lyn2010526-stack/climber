name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip pre-deploy tests'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Stage 1: Pre-deploy Validation
  # ===========================================================================
  pre-deploy-checks:
    name: Pre-deploy Validation
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: climber
          POSTGRES_PASSWORD: climber
          POSTGRES_DB: climber
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run smoke tests
        env:
          DATABASE_URL: postgresql+asyncpg://climber:climber@localhost:5432/climber
          APP_ENV: testing
        run: |
          pytest tests/ -x -q -m "unit" --timeout=30 -k "test_health or test_config or test_smoke"

      - name: Verify database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://climber:climber@localhost:5432/climber
        run: |
          alembic check || alembic upgrade --sql head > /dev/null

  # ===========================================================================
  # Stage 2: Build & Push Docker Images
  # ===========================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    if: |
      always() &&
      (needs.pre-deploy-checks.result == 'success' || inputs.skip_tests)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Output image digest
        run: |
          echo "Image built and pushed successfully"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  # ===========================================================================
  # Stage 3: Deploy to Staging
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.agent-engine.internal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "${STAGING_USER}@${STAGING_HOST}" \
            "cd ${DEPLOY_PATH} && \
             export IMAGE_TAG=${IMAGE_TAG} && \
             docker compose pull api && \
             docker compose up -d && \
             docker compose exec -T api alembic upgrade head && \
             docker compose exec -T api python scripts/health_check.py --json || exit 1"

      - name: Verify deployment
        id: verify
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts

          # Wait for service to be ready
          sleep 10

          # Health check with retries
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key "${STAGING_USER}@${STAGING_HOST}" \
              "curl -sf http://localhost:8000/health"; then
              echo "Deployment verified successfully"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Deployment verification failed"
          exit 1

      - name: Run smoke tests against staging
        if: success()
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key "${STAGING_USER}@${STAGING_HOST}" \
            "docker compose exec -T api pytest tests/ -x -q --timeout=30 -m 'unit' -k 'test_health'"

      - name: Rollback on failure
        if: failure()
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          echo "Deployment failed, initiating rollback..."
          ssh -i ~/.ssh/deploy_key "${STAGING_USER}@${STAGING_HOST}" \
            "cd ${DEPLOY_PATH} && docker compose down && docker compose up -d"

  # ===========================================================================
  # Stage 4: Deploy to Production
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://agent-engine.internal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$PROD_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "${PROD_USER}@${PROD_HOST}" \
            "cd ${DEPLOY_PATH} && \
             export IMAGE_TAG=${IMAGE_TAG} && \
             docker compose pull api && \
             docker compose up -d && \
             docker compose exec -T api alembic upgrade head"

      - name: Verify production deployment
        id: verify-prod
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PROD_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

          sleep 15

          for i in 1 2 3 4 5 6 7 8; do
            if ssh -i ~/.ssh/deploy_key "${PROD_USER}@${PROD_HOST}" \
              "curl -sf http://localhost:8000/health"; then
              echo "Production deployment verified"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Production verification failed"
          exit 1

      - name: Post-deploy health check
        if: success()
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key "${PROD_USER}@${PROD_HOST}" \
            "docker compose exec -T api python scripts/health_check.py --json"

      - name: Rollback on failure
        if: failure()
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          echo "Production deployment failed, initiating rollback..."
          ssh -i ~/.ssh/deploy_key "${PROD_USER}@${PROD_HOST}" \
            "cd ${DEPLOY_PATH} && docker compose down && docker compose up -d"

  # ===========================================================================
  # Stage 5: Post-deploy Notification
  # ===========================================================================
  notify:
    name: Deployment Notification
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify deployment status
        run: |
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "Production deployment completed successfully"
          elif [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            echo "Staging deployment completed successfully"
          else
            echo "Deployment failed"
          fi
